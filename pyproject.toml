[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gateway-action-model"
version = "0.1.0"
description = "Reproducible numerical and formal analysis of a gateway action model"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0", "reportlab>=4.0", "fastapi>=0.115", "uvicorn>=0.34"]

[tool.pytest.ini_options]
testpaths = ["tests"]
