<!doctype html>
<html lang="pt">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calculadora Axiomática Trivalente</title><link rel="stylesheet" href="style.css"></head>
<body><main>
  <header><p class="eyebrow">FEDERATED TRIVALENT MANIFOLD</p><h1>Calculadora axiomática</h1>
  <p>Gera especificações condicionais e obrigações de prova — nunca “provas” por visualização.</p></header>
  <section class="grid">
    <form id="form">
      <label>Problema<select id="problem"></select></label>
      <label>Regime<select id="truth"><option value="false">0 — falso</option><option value="half" selected>½ — aberto/condicional</option><option value="true">1 — verdadeiro</option></select></label>
      <div class="row"><label>α<input id="alpha" type="number" step="0.1" value="1"></label><label>β<input id="beta" type="number" step="0.1" value="1"></label></div>
      <div class="row"><label>Duração T<input id="duration" type="number" min="0.1" step="0.1" value="10"></label><label>Amostras<input id="samples" type="number" min="2" max="10000" value="200"></label></div>
      <label>Amplitude do êxodo e(t)<input id="exodus" type="number" step="0.01" value="0.2"></label>
      <label class="check"><input id="axiom" type="checkbox"> Aceitar o enunciado escolhido como axioma de trabalho</label>
      <button>Calcular e formalizar</button>
    </form>
    <article><h2>Resultado</h2><div id="badges"></div><dl id="metrics"></dl><p id="warning"></p></article>
  </section>
  <section><div class="tabs" id="tabs"></div><pre id="output"></pre></section>
</main><script src="app.js"></script></body></html>
