name: Multilanguage verification

on:
  push:
    branches: ["main", "research/**"]
  pull_request:

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_w_monotone.py tests/test_truncation_operator.py tests/test_renormalization_flow.py
      - run: g++ -std=c++17 -Wall -Wextra -Werror runtime/ftm_runtime.cpp -o /tmp/ftm_runtime
      - run: /tmp/ftm_runtime 0.2
      - run: python -c "from html.parser import HTMLParser; HTMLParser().feed(open('app/index.html', encoding='utf-8').read())"

  coq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y coq
      - run: coqc formal/coq/WMonotone.v
      - run: coqc formal/coq/Renormalization.v

  agda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y agda-bin
      - working-directory: formal/agda
        run: agda WMonotone.agda
